<svg xmlns="http://www.w3.org/2000/svg" width="991" height="444" viewBox="0 0 991 444" role="img" aria-labelledby="title desc">
<title id="title">单条线带在环面上的覆盖及 π 的面积谷</title>
<desc id="desc">左图给出一条宽度为四十八分之二的线带在单位环面上走十二步的覆盖范围。右图给出 π 对应的面积随时间的真实曲线，从 T=468 到约 68696，最低点为约 7.913%。</desc>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC","DejaVu Sans",sans-serif} .axis{font-family:"DejaVu Sans","Noto Sans CJK SC",sans-serif}</style>
