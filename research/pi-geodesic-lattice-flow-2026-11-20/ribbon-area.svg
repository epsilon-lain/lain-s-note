<text x="42.00" y="77.00" font-size="15" fill="#455e67" font-weight="normal" text-anchor="start" >θ = 2/5 + √2/1000，T = 12，竖向宽度 = 1/24</text>
<text x="413.00" y="46.00" font-size="26" fill="#102d38" font-weight="650" text-anchor="start" >π 的面积谷</text>
<text x="413.00" y="77.00" font-size="15" fill="#455e67" font-weight="normal" text-anchor="start" >θ = 1/(1 + π)，回归分数为 113/468</text>
